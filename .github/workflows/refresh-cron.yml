name: Refresh Data

# Backlog P2 #3: o plano Hobby da Vercel limita o cron nativo a 1 execução/dia,
# deixando dados (rodovias/notícias) dependentes de refresh manual.
# Este workflow mantém o deploy da Vercel INTACTO — nenhuma env var ou rota nova
# lá — apenas chama o endpoint já existente e protegido por CRON_SECRET.
#
# Repo secret CRON_SECRET configurado em Settings → Secrets and variables → Actions,
# com o MESMO valor da env CRON_SECRET do projeto backend na Vercel. O guard abaixo
# falha com exit 1 (mensagem clara no log) se o secret nao existir.
#
# Caveat: em repositórios públicos o GitHub suspende crons agendados após ~60
# dias sem commits — o cron diário da Vercel continua como base.

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-prod
  cancel-in-progress: false

jobs:
  refresh:
    name: Trigger production refresh
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: POST /api/v1/cron/refresh
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_URL: https://meteor2-0-frontend.vercel.app/api/v1/cron/refresh
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Repo secret CRON_SECRET nao configurado (Settings > Secrets > Actions)." >&2
            exit 1
          fi
          STATUS=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$API_URL")
          echo "HTTP $STATUS"
          cat response.json
          echo
          case "$STATUS" in
            2*) exit 0 ;;
            *) exit 1 ;;
          esac
